crons:
  - name: coaching-renewals
    description: "Daily 8am UK: emails monthly coaching pay links for memberships due within 3 days and flags lapsed ones"
    cron: "0 8 * * *"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/coaching/cron/renewals"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
